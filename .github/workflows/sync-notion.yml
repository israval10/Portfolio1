name: Sync projects from Notion

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-notion-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Notion access
        id: access
        run: |
          if [ -n "$NOTION_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "NOTION_TOKEN is not configured; skipping synchronization."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.access.outputs.ready == 'true'
        with:
          node-version: '24'
          cache: npm
      - if: steps.access.outputs.ready == 'true'
        run: npm ci
      - name: Refresh Notion projects
        if: steps.access.outputs.ready == 'true'
        run: npm run sync:notion
      - name: Check generated pages
        if: steps.access.outputs.ready == 'true'
        run: npm test
      - name: Publish changes
        if: steps.access.outputs.ready == 'true'
        id: publish
        run: |
          git add -A -- portfolio-data.js proyectos
          if [ -d images/notion ]; then git add -A -- images/notion; fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync projects from Notion"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger Vercel deployment
        if: steps.publish.outputs.changed == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK"
